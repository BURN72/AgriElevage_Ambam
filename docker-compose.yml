# Base PostgreSQL pour le développement local
# Utilisation : docker compose up -d
services:
  db:
    image: postgres:16
    container_name: agrielevage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrielevage
      POSTGRES_USER: agrielevage
      POSTGRES_PASSWORD: agrielevage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
